<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>모비스 개발부서</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  :root {
    --bg: #e4e1dc; --bg-grid: #d8d4cd; --plate: #f2f0eb; --plate-edge: #c7c1b5;
    --card: #ffffff; --input-bg: #ffffff; --ink: #221f1a; --ink-muted: #6d675c; --ink-faint: #a29b8d;
    --accent: #b8650b; --accent-ink: #fff8ef; --led: #3f7d4e; --readout-bg: #1e1b16; --readout-ink: #f2c98a;
    --danger: #9c3323; --danger-ink: #fff3ee; --shadow: rgba(34, 31, 26, 0.16); --overlay: rgba(20, 18, 15, 0.5);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #15171a; --bg-grid: #1b1e22; --plate: #1f2226; --plate-edge: #34383c;
      --card: #262a2e; --input-bg: #181a1d; --ink: #ece8e0; --ink-muted: #9b968c; --ink-faint: #6b6760;
      --accent: #e2933a; --accent-ink: #1c1206; --led: #5fbe79; --readout-bg: #0e0d0b; --readout-ink: #f4cd8f;
      --danger: #e2735c; --danger-ink: #2a0f08; --shadow: rgba(0, 0, 0, 0.45); --overlay: rgba(0, 0, 0, 0.6);
    }
  }
  :root[data-theme="dark"] {
    --bg: #15171a; --bg-grid: #1b1e22; --plate: #1f2226; --plate-edge: #34383c;
    --card: #262a2e; --input-bg: #181a1d; --ink: #ece8e0; --ink-muted: #9b968c; --ink-faint: #6b6760;
    --accent: #e2933a; --accent-ink: #1c1206; --led: #5fbe79; --readout-bg: #0e0d0b; --readout-ink: #f4cd8f;
    --danger: #e2735c; --danger-ink: #2a0f08; --shadow: rgba(0, 0, 0, 0.45); --overlay: rgba(0, 0, 0, 0.6);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: radial-gradient(circle at 1px 1px, var(--bg-grid) 1px, transparent 0) 0 0 / 22px 22px, var(--bg);
    color: var(--ink); font-family: "IBM Plex Sans KR", "Noto Sans KR", system-ui, sans-serif;
    min-height: 100vh; padding-block: 28px 60px;
  }
  .wrap { max-width: 880px; margin: 0 auto; padding-inline: 20px; }
  header.top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
  header.top h1 { margin: 0; font-size: clamp(22px, 4.5vw, 27px); font-weight: 700; letter-spacing: -0.01em; text-wrap: balance; }
  .eyebrow { display: flex; align-items: center; gap: 8px; font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 11px; font-weight: 600; letter-spacing: 0.12em; color: var(--ink-muted); text-transform: uppercase; }
  .eyebrow .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--led); box-shadow: 0 0 0 3px color-mix(in srgb, var(--led) 20%, transparent); flex: none; }
  .signout-btn { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 11px; font-weight: 600; color: var(--ink-muted); background: transparent; border: 1px solid var(--plate-edge); border-radius: 6px; padding: 6px 10px; cursor: pointer; }
  .signout-btn:hover { color: var(--ink); }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; border-bottom: 1px solid var(--plate-edge); margin-bottom: 22px; }
  .tab-btn { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-muted); background: transparent; border: none; border-bottom: 2px solid transparent; padding: 10px 6px 12px; cursor: pointer; margin-bottom: -1px; }
  .tab-btn[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
  .tab-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .panel-head { display: flex; gap: 10px; align-items: center; margin-bottom: 18px; flex-wrap: wrap; }
  .search { flex: 1; min-width: 160px; font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 13px; background: var(--readout-bg); color: var(--readout-ink); border: none; border-radius: 7px; padding: 11px 14px; }
  .search::placeholder { color: color-mix(in srgb, var(--readout-ink) 55%, transparent); }
  .search:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn { font-family: "IBM Plex Sans KR", sans-serif; font-size: 13.5px; font-weight: 600; border: none; border-radius: 6px; padding: 10px 16px; cursor: pointer; transition: filter 0.15s ease, transform 0.15s ease; }
  .btn:active { transform: translateY(1px); }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn-accent { background: var(--accent); color: var(--accent-ink); }
  .btn-accent:hover { filter: brightness(1.08); }
  .btn-ghost { background: transparent; color: var(--ink-muted); border: 1px solid var(--plate-edge); }
  .btn-ghost:hover { color: var(--ink); }
  .btn-danger { background: var(--danger); color: var(--danger-ink); }
  .btn-danger:hover { filter: brightness(1.08); }
  @media (prefers-reduced-motion: reduce) { .btn { transition: none; } }
  .cat-label { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-faint); margin: 22px 0 10px; padding-bottom: 6px; border-bottom: 1px solid var(--plate-edge); }
  .cat-label:first-child { margin-top: 0; }
  .mat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
  .mat-card { position: relative; text-align: left; background: var(--card); border: 1px solid var(--plate-edge); border-radius: 8px; padding: 14px 16px 16px; cursor: pointer; font-family: inherit; color: inherit; display: flex; flex-direction: column; gap: 6px; }
  .mat-card:hover { border-color: var(--accent); }
  .mat-card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .mat-card-title { font-weight: 600; font-size: 14.5px; text-wrap: balance; }
  .mat-card-snip { font-size: 12.5px; color: var(--ink-muted); line-height: 1.5; }
  .badge { align-self: flex-start; font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 10px; font-weight: 600; letter-spacing: 0.06em; color: var(--accent); border: 1px solid var(--accent); border-radius: 999px; padding: 1px 8px; }
  .badge-new { color: var(--led); border-color: var(--led); }
  .cat-filter { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 16px; }
  .cat-chip { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 11.5px; font-weight: 600; letter-spacing: 0.02em; color: var(--ink-muted); background: var(--card); border: 1px solid var(--plate-edge); border-radius: 999px; padding: 5px 12px; cursor: pointer; }
  .cat-chip:hover { color: var(--ink); border-color: var(--accent); }
  .cat-chip[aria-pressed="true"] { color: var(--accent-ink); background: var(--accent); border-color: var(--accent); }
  .cat-chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .link-btn { background: none; border: none; padding: 0; color: var(--accent); font-size: 12.5px; cursor: pointer; text-decoration: underline; font-family: inherit; }
  .gl-list-lang { margin: -6px 0 10px; }
  .gl-list { display: flex; flex-direction: column; border-top: 1px solid var(--plate-edge); }
  .gl-table-wrap { overflow-x: auto; margin-top: 6px; }
  .glossary-table { width: 100%; border-collapse: collapse; background: var(--card); font-size: 13px; table-layout: fixed; }
  .glossary-table th, .glossary-table td { border: 1px solid var(--plate-edge); padding: 8px 10px; text-align: left; vertical-align: top; overflow-wrap: break-word; }
  .glossary-table th { background: var(--plate); font-weight: 600; }
  .glossary-table tr.important td { background: color-mix(in srgb, var(--accent) 10%, transparent); }
  .gl-star-cell { width: 32px; text-align: center; }
  .gl-term-kr-cell { width: 13%; font-family: "IBM Plex Mono", ui-monospace, monospace; font-weight: 700; cursor: pointer; }
  .gl-term-en-cell { width: 15%; font-family: "IBM Plex Mono", ui-monospace, monospace; color: var(--ink-muted); cursor: pointer; }
  .gl-dept-cell { width: 9%; color: var(--ink-muted); cursor: pointer; }
  .gl-def-cell { width: auto; cursor: pointer; line-height: 1.5; }
  .gl-row-click:hover { background: var(--plate); }
  .gl-calc { margin-top: 3px; font-size: 11.5px; color: var(--ink-faint); }
  .gl-star-btn { background: none; border: none; cursor: pointer; font-size: 15px; line-height: 1; padding: 2px; color: var(--ink-faint); }
  .gl-star-btn.on { color: var(--accent); }
  .gl-star-btn:hover { color: var(--accent); }
  .gl-star-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  .empty { font-size: 13.5px; color: var(--ink-faint); padding: 30px 0; text-align: center; }
  .notes-card { background: var(--card); border: 1px solid var(--plate-edge); border-radius: 8px; padding: 16px; }
  #notes-area { width: 100%; min-height: 280px; resize: vertical; background: var(--input-bg); color: var(--ink); border: 1px solid var(--plate-edge); border-radius: 6px; padding: 14px; font-family: "IBM Plex Sans KR", sans-serif; font-size: 14px; line-height: 1.6; }
  #notes-area:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .notes-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
  #notes-status { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 11.5px; color: var(--ink-faint); }
  .notes-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .overlay { position: fixed; inset: 0; background: var(--overlay); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 10; }
  .overlay.overlay-fullpage { padding: 0; background: var(--bg); }
  .modal { width: 100%; max-width: 480px; max-height: 86vh; overflow-y: auto; background: var(--plate); border: 1px solid var(--plate-edge); border-radius: 10px; box-shadow: 0 24px 50px -20px var(--shadow); padding: 22px 22px 20px; }
  .modal.modal-large { max-width: min(980px, 96vw); max-height: 94vh; }
  .modal.modal-fullpage { width: 100%; max-width: none; height: 100%; max-height: none; border: none; border-radius: 0; box-shadow: none; background: var(--bg); padding: 0; overflow: hidden; display: flex; flex-direction: column; }
  .modal.modal-fullpage > h2 { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
  .detail-page-bar { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 20px; border-bottom: 1px solid var(--plate-edge); background: var(--plate); flex: none; }
  .detail-page-scroll { flex: 1; overflow-y: auto; }
  .detail-page-inner { max-width: 760px; margin: 0 auto; padding: 32px 24px 80px; }
  .detail-page-inner h1 { margin: 0 0 10px; font-size: clamp(20px, 3vw, 27px); font-weight: 700; text-wrap: balance; }
  .modal h2 { margin: 0 0 16px; font-size: 17px; font-weight: 700; text-wrap: balance; }
  .f-label { display: block; font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-faint); margin: 14px 0 6px; }
  .f-label:first-child { margin-top: 0; }
  .f-input { width: 100%; background: var(--input-bg); color: var(--ink); border: 1px solid var(--plate-edge); border-radius: 6px; padding: 9px 11px; font-family: "IBM Plex Sans KR", sans-serif; font-size: 14px; }
  .f-input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .f-textarea { resize: vertical; min-height: 110px; line-height: 1.55; }
  .f-richtext { min-height: 140px; max-height: 50vh; overflow-y: auto; line-height: 1.6; }
  .f-richtext:empty::before { content: attr(data-placeholder); color: var(--ink-faint); }
  .f-richtext p, .f-richtext ul, .f-richtext ol, .f-richtext table { margin: 0 0 8px; }
  .f-richtext table { border-collapse: collapse; }
  .f-richtext td, .f-richtext th { border: 1px solid var(--plate-edge); padding: 4px 8px; }
  .f-check { display: flex; align-items: center; gap: 8px; margin: 16px 0 4px; font-size: 13.5px; color: var(--ink-muted); }
  .f-actions { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 20px; }
  .f-actions-right { display: flex; gap: 8px; }
  .detail-meta { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 11.5px; color: var(--ink-faint); margin: 0 0 14px; }
  .detail-body { font-size: 14.5px; line-height: 1.7; margin: 0; white-space: pre-wrap; word-break: break-word; }
  .detail-body-rich { white-space: normal; }
  .detail-body-rich p, .detail-body-rich ul, .detail-body-rich ol, .detail-body-rich table { margin: 0 0 10px; }
  .detail-body-rich table { border-collapse: collapse; max-width: 100%; }
  .detail-body-rich td, .detail-body-rich th { border: 1px solid var(--plate-edge); padding: 5px 9px; }
  .detail-body-rich a { color: var(--accent); }
  .report-list { border-top: 1px solid var(--plate-edge); margin-bottom: 20px; }
  .report-row { display: flex; align-items: flex-start; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--plate-edge); }
  .report-row input[type="checkbox"] { margin-top: 3px; flex: none; }
  .report-row .r-title { font-weight: 600; font-size: 14px; }
  .report-row .r-meta { font-size: 12px; color: var(--ink-muted); }
  .toast { position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 12px); background: var(--ink); color: var(--plate); font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 12px; font-weight: 600; letter-spacing: 0.02em; padding: 10px 18px; border-radius: 999px; max-width: calc(100% - 40px); text-align: center; opacity: 0; pointer-events: none; transition: opacity 0.18s ease, transform 0.18s ease; z-index: 20; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  @media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
  .dropzone { margin: 0 0 16px; padding: 16px; border: 2px dashed var(--plate-edge); border-radius: 10px; text-align: center; font-size: 12.5px; color: var(--ink-muted); cursor: pointer; }
  .dropzone:hover, .dropzone:focus-visible { border-color: var(--accent); color: var(--ink); }
  .dropzone.drag-over { border-color: var(--accent); color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, transparent); }
  .dropzone:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .drop-overlay { position: fixed; inset: 10px; display: flex; align-items: center; justify-content: center; border: 3px dashed var(--accent); border-radius: 14px; background: color-mix(in srgb, var(--accent) 12%, var(--overlay)); color: var(--accent); font-size: clamp(16px, 3vw, 22px); font-weight: 700; z-index: 30; pointer-events: none; }

  /* login screen */
  .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .login-card { width: 100%; max-width: 360px; background: var(--plate); border: 1px solid var(--plate-edge); border-radius: 10px; box-shadow: 0 18px 40px -18px var(--shadow); padding: 30px 26px; }
  .login-card h1 { font-size: 20px; margin: 0 0 4px; }
  .login-card p.sub { margin: 0 0 22px; font-size: 13px; color: var(--ink-muted); }
  .login-error { font-size: 12.5px; color: var(--danger); margin: 10px 0 0; min-height: 16px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>

<div id="login-screen" class="login-wrap">
  <div class="login-card">
    <p class="eyebrow"><span class="dot"></span>LOGIN</p>
    <h1>모비스 개발부서</h1>
    <p class="sub">등록된 계정으로 로그인하세요</p>
    <label class="f-label" for="login-email">이메일</label>
    <input class="f-input" id="login-email" type="email" autocomplete="username">
    <label class="f-label" for="login-pw">비밀번호</label>
    <input class="f-input" id="login-pw" type="password" autocomplete="current-password">
    <p class="login-error" id="login-error"></p>
    <div class="f-actions" style="justify-content:flex-end; margin-top:18px;">
      <button class="btn btn-accent" id="login-btn" type="button">로그인</button>
    </div>
  </div>
</div>

<div id="app" class="wrap" hidden>
  <header class="top">
    <div>
      <p class="eyebrow"><span class="dot"></span><span id="app-eyebrow">내가 채우는 학습 포털</span></p>
      <h1 id="app-title">모비스 개발부서</h1>
    </div>
    <button class="signout-btn" id="signout-btn" type="button">로그아웃</button>
  </header>

  <nav class="tabs" role="tablist">
    <button class="tab-btn" data-tab="materials" role="tab" aria-selected="true" id="tab-materials">학습자료</button>
    <button class="tab-btn" data-tab="glossary" role="tab" aria-selected="false" id="tab-glossary">용어집</button>
    <button class="tab-btn" data-tab="notes" role="tab" aria-selected="false" id="tab-notes">노트</button>
    <button class="tab-btn" data-tab="report" role="tab" aria-selected="false" id="tab-report">보고서</button>
    <button class="tab-btn lang-btn" id="lang-toggle-btn" type="button">Eng. Version</button>
  </nav>

  <section id="panel-materials">
    <div class="panel-head">
      <input class="search" id="mat-search" type="text" placeholder="자료 검색…">
      <button class="btn btn-ghost" id="mat-import-btn" type="button" hidden>자료 가져오기 (JSON)</button>
      <input type="file" id="mat-import-file" accept="application/json" multiple hidden>
      <button class="btn btn-accent" id="mat-add-btn" type="button">새 자료 추가</button>
    </div>
    <div class="dropzone" id="mat-dropzone" tabindex="0" role="button" hidden>JSON 파일을 여기로 끌어다 놓거나 클릭해서 선택하세요</div>
    <div class="cat-filter" id="mat-cat-filter"></div>
    <div id="mat-list"></div>
    <p class="empty" id="mat-empty" hidden>등록된 자료가 없습니다. "새 자료 추가"로 첫 항목을 만들어보세요.</p>
  </section>

  <section id="panel-glossary" hidden>
    <div class="panel-head">
      <input class="search" id="gl-search" type="text" placeholder="용어 검색…">
      <button class="btn btn-ghost" id="gl-import-btn" type="button" hidden>용어 가져오기 (JSON)</button>
      <input type="file" id="gl-import-file" accept="application/json" multiple hidden>
      <button class="btn btn-accent" id="gl-add-btn" type="button">새 용어 추가</button>
    </div>
    <div class="dropzone" id="gl-dropzone" tabindex="0" role="button" hidden>JSON 파일을 여기로 끌어다 놓거나 클릭해서 선택하세요</div>
    <p class="gl-list-lang"><button type="button" class="link-btn" id="gl-list-lang-btn">English list →</button></p>
    <div class="gl-table-wrap">
      <table class="glossary-table">
        <thead><tr id="gl-thead"></tr></thead>
        <tbody id="gl-list"></tbody>
      </table>
    </div>
    <p class="empty" id="gl-empty" hidden>등록된 용어가 없습니다.</p>
  </section>

  <section id="panel-notes" hidden>
    <div class="notes-card">
      <textarea id="notes-area" placeholder="오늘 배운 내용, 궁금한 점을 자유롭게 적어보세요. 다른 기기에서도 그대로 이어집니다."></textarea>
      <div class="notes-foot">
        <span id="notes-status">동기화 대기 중…</span>
        <div class="notes-actions">
          <button class="btn btn-ghost" id="notes-clear-btn" type="button">지우기</button>
          <button class="btn btn-ghost" id="notes-export-btn" type="button">텍스트로 내보내기</button>
          <button class="btn btn-accent" id="notes-save-material-btn" type="button">학습자료로 저장</button>
        </div>
      </div>
    </div>
  </section>

  <section id="panel-report" hidden>
    <label class="f-label" for="report-title" id="report-title-label">보고서 제목</label>
    <input class="f-input" id="report-title" type="text" placeholder="예: 이번 주 학습 정리" style="margin-bottom:18px;">
    <label class="f-check" style="margin-bottom:14px;"><input type="checkbox" id="report-include-notes"> <span id="report-include-notes-label">현재 노트 내용 포함</span></label>
    <p class="f-label" style="margin-bottom:6px;" id="report-materials-label">포함할 학습자료</p>
    <div class="report-list" id="report-list"></div>
    <p class="empty" id="report-empty" hidden>선택할 수 있는 학습자료가 없습니다.</p>
    <div class="f-actions" style="margin-top:0;">
      <span></span>
      <div class="f-actions-right">
        <button class="btn btn-accent" id="report-export-btn" type="button">보고서로 내보내기</button>
      </div>
    </div>
  </section>
</div>

<div class="overlay" id="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="modal">
    <h2 id="modal-title"></h2>
    <div id="modal-body"></div>
  </div>

  function readFileAsText(file) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onload = function () { resolve(reader.result); };
      reader.onerror = function () { reject(reader.error); };
      reader.readAsText(file);
    });
  }
  function isJsonFile(file) { return file && (/\.json$/i.test(file.name) || file.type === 'application/json'); }

  function importMaterialsFromFiles(fileList) {
    var files = Array.prototype.filter.call(fileList || [], isJsonFile);
    if (!files.length) { showToast(t('importBadFile')); return; }
    el.matImportBtn.disabled = true;
    var added = 0, skipped = 0, badFiles = 0;
    var batchId = newBatchId();
    var chain = Promise.resolve();
    files.forEach(function (file) {
      chain = chain.then(function () {
        return readFileAsText(file).then(function (text) {
          var items;
          try { items = JSON.parse(text); } catch (e) { badFiles++; return; }
          if (!Array.isArray(items)) { badFiles++; return; }
          var inner = Promise.resolve();
          items.forEach(function (item) {
            inner = inner.then(function () {
              if (!item || !item.title || !item.body) { skipped++; return; }
              var bodyIsHtml = item.bodyIsHtml !== false;
              var plainBody = bodyIsHtml ? stripTags(item.body) : item.body;
              if (findDuplicateMaterial(item.title, plainBody)) { skipped++; return; }
              return db.collection('materials').add({
                title: item.title, category: item.category || '기타', body: sanitizeHtml(item.body),
                bodyIsHtml: bodyIsHtml, addedAt: item.addedAt || new Date().toISOString(), isExample: false,
                batchId: batchId,
                visibleToUid: item.visibleToUid || '',
              }).then(function () { added++; });
            });
          });
          return inner;
        }).catch(function () { badFiles++; });
      });
    });
    chain.then(function () {
      el.matImportBtn.disabled = false;
      var msg = t('importDone').replace('{added}', added);
      if (skipped) msg += t('importSkipped').replace('{skipped}', skipped);
      if (badFiles) msg += t('importBadFileCount').replace('{count}', badFiles);
      showToast(msg);
    });
  }
  el.matImportBtn.addEventListener('click', function () { el.matImportFile.value = ''; el.matImportFile.click(); });
  el.matImportFile.addEventListener('change', function () { importMaterialsFromFiles(el.matImportFile.files); });
  el.glAddBtn.addEventListener('click', function () { openGlossaryForm(null); });

  function importGlossaryFromFiles(fileList) {
    var files = Array.prototype.filter.call(fileList || [], isJsonFile);
    if (!files.length) { showToast(t('importBadFile')); return; }
    el.glImportBtn.disabled = true;
    var added = 0, skipped = 0, badFiles = 0;
    var chain = Promise.resolve();
    files.forEach(function (file) {
      chain = chain.then(function () {
        return readFileAsText(file).then(function (text) {
          var items;
          try { items = JSON.parse(text); } catch (e) { badFiles++; return; }
          if (!Array.isArray(items)) { badFiles++; return; }
          var inner = Promise.resolve();
          items.forEach(function (item) {
            inner = inner.then(function () {
              if (!item || (!item.term_kr && !item.term_en)) { skipped++; return; }
              if (findDuplicateGlossary(item.term_kr || '', item.term_en || '', item.definition || '')) { skipped++; return; }
              return db.collection('glossary').add({
                term_kr: item.term_kr || '', term_en: item.term_en || '', department: item.department || '',
                definition: item.definition || '', definition_en: item.definition_en || '', calc: item.calc || '', important: !!item.important,
                addedAt: item.addedAt || new Date().toISOString(), isExample: false,
              }).then(function () { added++; });
            });
          });
          return inner;
        }).catch(function () { badFiles++; });
      });
    });
    chain.then(function () {
      el.glImportBtn.disabled = false;
      var msg = t('importDone').replace('{added}', added);
      if (skipped) msg += t('importSkipped').replace('{skipped}', skipped);
      if (badFiles) msg += t('importBadFileCount').replace('{count}', badFiles);
      showToast(msg);
    });
  }
  el.glImportBtn.addEventListener('click', function () { el.glImportFile.value = ''; el.glImportFile.click(); });
  el.glImportFile.addEventListener('change', function () { importGlossaryFromFiles(el.glImportFile.files); });

  // ---- drag & drop JSON import ----
  // The dropzone boxes (#mat-dropzone / #gl-dropzone) are the actual drop targets:
  // click or drop a file directly on one. The window-level listeners below only show
  // a full-screen "drop to import" cue while dragging and stop the browser from
  // navigating away if a file is dropped outside a zone; they never import anything
  // themselves (the zone's drop handler calls stopPropagation so this never double-fires).
  var dragDepth = 0;
  function dropTargetActive() {
    return state.isOwner && !el.app.hidden && (state.activeTab === 'materials' || state.activeTab === 'glossary');
  }
  window.addEventListener('dragenter', function (e) {
    e.preventDefault();
    if (!dropTargetActive()) return;
    dragDepth++;
    el.dropOverlay.hidden = false;
  });
  window.addEventListener('dragover', function (e) { e.preventDefault(); });
  window.addEventListener('dragleave', function (e) {
    e.preventDefault();
    if (!dropTargetActive()) return;
    dragDepth = Math.max(0, dragDepth - 1);
    if (dragDepth === 0) el.dropOverlay.hidden = true;
  });
  window.addEventListener('drop', function (e) {
    e.preventDefault();
    dragDepth = 0;
    el.dropOverlay.hidden = true;
  });

  function wireDropzone(zoneEl, fileInputEl, importFn) {
    zoneEl.addEventListener('click', function () { fileInputEl.value = ''; fileInputEl.click(); });
    zoneEl.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fileInputEl.value = ''; fileInputEl.click(); }
    });
    zoneEl.addEventListener('dragover', function (e) { e.preventDefault(); e.stopPropagation(); zoneEl.classList.add('drag-over'); });
    zoneEl.addEventListener('dragleave', function (e) { e.preventDefault(); e.stopPropagation(); zoneEl.classList.remove('drag-over'); });
    zoneEl.addEventListener('drop', function (e) {
      e.preventDefault();
      e.stopPropagation();
      zoneEl.classList.remove('drag-over');
      dragDepth = 0;
      el.dropOverlay.hidden = true;
      if (!e.dataTransfer || !e.dataTransfer.files || !e.dataTransfer.files.length) return;
      importFn(e.dataTransfer.files);
    });
  }
  wireDropzone(el.matDropzone, el.matImportFile, importMaterialsFromFiles);
  wireDropzone(el.glDropzone, el.glImportFile, importGlossaryFromFiles);

  // ---- auth ----
  el.loginBtn.addEventListener('click', function () {
    el.loginError.textContent = '';
    var email = el.loginEmail.value.trim();
    var pw = el.loginPw.value;
    if (!email || !pw) { el.loginError.textContent = '이메일과 비밀번호를 입력해주세요.'; return; }
    el.loginBtn.disabled = true;
    auth.signInWithEmailAndPassword(email, pw).catch(function (e) {
      el.loginError.textContent = '로그인 실패: 이메일 또는 비밀번호를 확인해주세요.';
    }).finally(function () { el.loginBtn.disabled = false; });
  });
  el.loginPw.addEventListener('keydown', function (e) { if (e.key === 'Enter') el.loginBtn.click(); });
  el.signoutBtn.addEventListener('click', function () { auth.signOut(); });

  function subscribe() {
    unsubMaterials = db.collection('materials').onSnapshot(function (snap) {
      state.materials = snap.docs.map(function (d) { var data = d.data() || {}; data.id = d.id; return data; });
      state.materialsLoaded = true;
      var nb = computeNewestBatch(visibleMaterials());
      state.newestMaterialAddedAt = nb.time;
      state.newestMaterialBatchId = nb.batchId;
      renderMaterials();
      renderReportList();
    }, function (e) { showToast(errMsg(e)); });

    unsubGlossary = db.collection('glossary').onSnapshot(function (snap) {
      state.glossary = snap.docs.map(function (d) { var data = d.data() || {}; data.id = d.id; return data; });
      state.glossaryLoaded = true;
      renderGlossary();
    }, function (e) { showToast(errMsg(e)); });

    unsubNotes = db.doc('notes/current').onSnapshot(function (snap) {
      var data = snap.data() || {};
      var content = data.content || '';
      if (document.activeElement !== el.notesArea && content !== lastSyncedNotes) {
        el.notesArea.value = content; lastSyncedNotes = content;
        el.notesStatus.textContent = data.updatedAt ? t('notesSynced') + fmtTime(data.updatedAt) : '';
      }
    }, function (e) { el.notesStatus.textContent = errMsg(e); });
  }
  function unsubscribeAll() {
    if (unsubMaterials) unsubMaterials();
    if (unsubGlossary) unsubGlossary();
    if (unsubNotes) unsubNotes();
  }

  auth.onAuthStateChanged(function (user) {
    if (user) {
      state.isOwner = user.uid === OWNER_UID;
      state.uid = user.uid;
      el.loginScreen.hidden = true;
      el.app.hidden = false;
      applyLang();
      switchTab('materials');
      renderMaterials(); renderGlossary(); renderReportList();
      subscribe();
    } else {
      unsubscribeAll();
      el.app.hidden = true;
      el.loginScreen.hidden = false;
      el.loginPw.value = '';
    }
  });
})();
</script>
</body>
</html>
